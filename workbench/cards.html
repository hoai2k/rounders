<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rounders — Card Workbench</title>
    <!-- The game's own stylesheet, so a card here IS the card in the game -->
    <link rel="stylesheet" href="../styles.css" />
    <style>
      /* Layout for the browser page itself; card faces come from styles.css */
      html, body { height: auto; min-height: 100%; overflow: auto; }
      body {
        margin: 0;
        background:
          radial-gradient(ellipse at 50% -10%, #2a2f42, transparent 60%),
          linear-gradient(180deg, #171a24, #0d0f16);
        color: #f5f2ff;
        font-family: system-ui, sans-serif;
      }
      .cw-bar {
        position: sticky; top: 0; z-index: 10;
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        padding: 12px 18px;
        background: rgba(13, 15, 22, 0.92);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(6px);
      }
      .cw-bar h1 { margin: 0 8px 0 0; font-size: 17px; letter-spacing: 0.04em; }
      .cw-count { opacity: 0.6; font-size: 13px; }
      .cw-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
      .cw-chip {
        border: 1px solid color-mix(in srgb, var(--c, #b8c4d0) 55%, transparent);
        color: var(--c, #b8c4d0);
        background: color-mix(in srgb, var(--c, #b8c4d0) 10%, transparent);
        border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700;
        cursor: pointer;
      }
      .cw-chip.off { opacity: 0.32; filter: saturate(0.4); }
      .cw-back { color: #8fb8ff; font-size: 13px; text-decoration: none; }

      /* featured card: one card, big, exactly as the draft hand shows it */
      .cw-stage {
        display: flex; align-items: center; justify-content: center; gap: 26px;
        padding: 34px 16px 10px;
        --cardw: clamp(240px, 34vh, 340px);
      }
      .cw-stage .card { cursor: default; margin: 0; animation: none; }
      /* the viewer has room the draft hand doesn't — show the whole rules text */
      .cw-stage .card-desc { -webkit-line-clamp: unset; overflow: visible; }
      .cw-stage .card:hover { transform: none; }
      .cw-arrow {
        width: 52px; height: 52px; border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06);
        color: #fff; font-size: 22px; cursor: pointer; flex: none;
      }
      .cw-arrow:hover { background: rgba(255, 255, 255, 0.14); }
      /* the preview: a live sim of the card, next to the card itself */
      .cw-preview { display: none; flex: none; width: min(720px, 46vw); }
      .cw-preview.on { display: block; }
      .cw-preview canvas {
        width: 100%; aspect-ratio: 720 / 320; display: block;
        border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.14);
        background: #12141c;
      }
      .cw-prev-head {
        display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
      }
      .cw-prev-head strong { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75; }
      .cw-btn {
        border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.08);
        color: #f5f2ff; border-radius: 8px; padding: 5px 12px; font-size: 12px;
        font-weight: 700; cursor: pointer;
      }
      .cw-btn:hover { background: rgba(255, 255, 255, 0.16); }
      .cw-btn.primary { background: #4da6ff; border-color: #4da6ff; color: #08111d; }
      .cw-watch { margin: 8px 0 0; padding: 0 0 0 18px; font-size: 12.5px; line-height: 1.5; opacity: 0.8; }
      .cw-watch li { margin: 1px 0; }
      /* bullet viewer: 1:1 world pixels, so what you see is the in-game size */
      #bulletCanvas {
        width: 100%; aspect-ratio: 960 / 220; display: block;
        border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12); background: #0f111a;
      }
      .cw-sliders { display: grid; gap: 6px; margin-top: 8px; }
      .cw-sliders label { display: flex; align-items: center; gap: 10px; font-size: 12px; opacity: 0.85; }
      .cw-sliders input[type="range"] { flex: 1; }
      .cw-sliders output { width: 56px; text-align: right; font-variant-numeric: tabular-nums; opacity: 0.75; }
      .cw-meta { text-align: center; padding: 10px 16px 4px; font-size: 13px; opacity: 0.75; }
      .cw-meta b { letter-spacing: 0.03em; }
      .cw-hint { text-align: center; font-size: 12px; opacity: 0.45; padding-bottom: 14px; }

      /* the full set, fanned flat as a grid of real (small) card faces */
      .cw-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 14px 10px;
        padding: 10px 22px 60px;
        --cardw: 100%;
      }
      .cw-grid .card { margin: 0; animation: none; width: 100%; }
      .cw-grid .card:hover { transform: translateY(-6px); }
      .cw-grid .card.current {
        border-color: #fff;
        box-shadow: 0 0 0 2px #fff, 0 0 30px var(--rglow), 0 12px 26px rgba(0, 0, 0, 0.5);
      }
      .cw-grid .card.hidden-rarity { display: none; }
      .cw-rarity-head {
        grid-column: 1 / -1;
        margin: 16px 0 0;
        font-size: 12px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase;
        color: var(--c); opacity: 0.9;
      }
      .cw-rarity-head.hidden-rarity { display: none; }
    </style>
  </head>
  <body>
    <header class="cw-bar">
      <h1>Card Workbench</h1>
      <span class="cw-count" id="count"></span>
      <span class="cw-filters" id="filters"></span>
      <button class="cw-btn" id="exportBtn" title="Download the tweaks you've made as JSON">⬇ Export changes</button>
      <span class="cw-count" id="tweakCount"></span>
      <a class="cw-back" href="index.html">Sprite workbench →</a>
    </header>

    <section class="cw-stage">
      <button class="cw-arrow" id="prev" title="Previous card (←)">←</button>
      <div id="featured"></div>
      <section class="cw-preview" id="preview">
        <div class="cw-prev-head">
          <strong>Preview</strong>
          <button class="cw-btn" id="replayBtn">↻ Replay</button>
          <button class="cw-btn" id="closePrev">Close</button>
        </div>
        <canvas id="simCanvas" width="1440" height="640"></canvas>
        <ul class="cw-watch" id="watch"></ul>

        <div class="cw-prev-head" style="margin-top:14px">
          <strong>Bullet — game size</strong>
          <span class="cw-count" id="bulletInfo"></span>
          <button class="cw-btn" id="resetBullet">Reset</button>
        </div>
        <canvas id="bulletCanvas" width="960" height="220"></canvas>
        <div class="cw-sliders">
          <label>Size <input id="bScale" type="range" min="0.2" max="4" step="0.05" value="1" /><output id="bScaleOut">1.00×</output></label>
          <label>Rotation <input id="bRot" type="range" min="-180" max="180" step="1" value="0" /><output id="bRotOut">0°</output></label>
        </div>
      </section>
      <button class="cw-arrow" id="next" title="Next card (→)">→</button>
    </section>
    <p style="text-align:center;margin:6px 0 0">
      <button class="cw-btn primary" id="previewBtn">▶ Preview this card</button>
    </p>
    <p class="cw-meta" id="meta"></p>
    <p class="cw-hint">← / → or click a card below to flip through the set. Number keys toggle rarities.</p>

    <main class="cw-grid" id="grid"></main>

    <script>window.ROUNDERS_ASSET_BASE = "../";</script>
    <script src="../js/chroma.js"></script>
    <script src="../js/characters.js"></script>
    <script src="../js/cards.js"></script>
    <script src="../js/gameplay.js"></script>
    <script src="../js/cardsim.js"></script>
    <script>
      (() => {
        "use strict";
        const { CARDS, RARITIES, RARITY_ORDER, cardArtUrl, cardSceneUrl } = window.ROUNDERS;
        const grid = document.getElementById("grid");
        const featured = document.getElementById("featured");
        const meta = document.getElementById("meta");
        const countEl = document.getElementById("count");
        const filtersEl = document.getElementById("filters");

        // ordered by rarity ladder, then as authored inside each rarity
        const ordered = RARITY_ORDER.flatMap(r => CARDS.filter(c => c.rarity === r));
        const shown = new Set(RARITY_ORDER);
        let index = Math.max(0, ordered.findIndex(c => c.id === new URLSearchParams(location.search).get("card")));

        // exactly the markup renderDraftPanel() builds in game.js, so the page
        // shows the card the way the draft hand does
        function cardHtml(c, big) {
          const rar = RARITIES[c.rarity];
          return `
            <article class="card r-${c.rarity}${big ? " selected" : ""}" data-id="${c.id}"
                     style="--rcol:${rar.color};--rglow:${rar.glow};--tilt:0deg">
              <span class="card-pip">${rar.name[0]}</span>
              <span class="rarity">${rar.name}</span>
              <span class="card-art" style="--scene:url('${cardSceneUrl(c.id)}');--emblem:url('${cardArtUrl(c.id)}')"></span>
              <strong class="card-name">${c.name}</strong>
              <em class="card-tagline">${c.tagline}</em>
              <p class="card-desc">${c.description}</p>
              <div class="stat-list">${c.effects.map(s => `<span>${s}</span>`).join("")}</div>
              <span class="card-pip flip">${rar.name[0]}</span>
            </article>`;
        }

        function visible() { return ordered.filter(c => shown.has(c.rarity)); }

        // ------------------------------------------------------- preview sim
        const previewEl = document.getElementById("preview");
        const watchEl = document.getElementById("watch");
        const simCanvas = document.getElementById("simCanvas");
        let sim = null;
        let previewOn = new URLSearchParams(location.search).get("preview") === "1";

        function stopSim() { if (sim) { sim.stop(); sim = null; } }

        function buildSim(card) {
          stopSim();
          if (!previewOn) { previewEl.classList.remove("on"); return; }
          previewEl.classList.add("on");
          sim = window.ROUNDERS.CARD_SIM.createSim(simCanvas, card);
          watchEl.innerHTML = sim.plan.watch.map(w => `<li>${w}</li>`).join("");
          sim.start();
        }

        document.getElementById("previewBtn").addEventListener("click", () => {
          previewOn = !previewOn;
          const url = new URL(location);
          if (previewOn) url.searchParams.set("preview", "1"); else url.searchParams.delete("preview");
          history.replaceState(null, "", url);
          renderFeatured();
        });
        document.getElementById("closePrev").addEventListener("click", () => {
          previewOn = false;
          const url = new URL(location);
          url.searchParams.delete("preview");
          history.replaceState(null, "", url);
          renderFeatured();
        });
        document.getElementById("replayBtn").addEventListener("click", () => { if (sim) sim.replay(); });

        // ------------------------------------------------- bullet viewer
        // Tweaks live in localStorage while you work and come out of the
        // Export button as JSON — the same shape the game would read from
        // assets/images/bullets/tweaks.json.
        const TWEAK_KEY = "rounders.bulletTweaks";
        let tweaks = {};
        try { tweaks = JSON.parse(localStorage.getItem(TWEAK_KEY) || "{}"); } catch { tweaks = {}; }

        const bulletCanvas = document.getElementById("bulletCanvas");
        const bctx = bulletCanvas.getContext("2d");
        const bScale = document.getElementById("bScale");
        const bRot = document.getElementById("bRot");
        const bScaleOut = document.getElementById("bScaleOut");
        const bRotOut = document.getElementById("bRotOut");
        const bulletInfo = document.getElementById("bulletInfo");
        const bulletArt = new Map();

        function tweakCount() {
          const n = Object.keys(tweaks).length;
          document.getElementById("tweakCount").textContent = n ? `${n} tweaked` : "";
        }

        function loadBulletArt(id) {
          if (bulletArt.has(id)) return bulletArt.get(id);
          const entry = { img: new Image(), ok: false };
          entry.img.onload = () => { entry.ok = true; drawBulletPane(); };
          entry.img.onerror = () => { entry.ok = false; };
          entry.img.src = `../assets/images/bullets/${id}.png`;
          bulletArt.set(id, entry);
          return entry;
        }

        function currentCard() { const l = visible(); return l[((index % l.length) + l.length) % l.length]; }

        function drawBulletPane() {
          const c = currentCard();
          if (!c) return;
          const { CARD_SIM } = window.ROUNDERS;
          const spec = CARD_SIM.bulletSpec(c);
          const tw = tweaks[c.id] || {};
          const scale = tw.scale ?? 1;
          const rotation = tw.rotation ?? 0;
          const art = loadBulletArt(c.id);

          // 1:1 world pixels: the canvas backing store is drawn at native size
          // and only stretched by CSS, so this is the size the game draws.
          const W = bulletCanvas.width, H = bulletCanvas.height;
          bctx.clearRect(0, 0, W, H);
          bctx.fillStyle = "#0f111a";
          bctx.fillRect(0, 0, W, H);
          // a fighter-radius circle for scale reference, and the ground line
          bctx.save();
          bctx.translate(W * 0.22, H / 2);
          bctx.strokeStyle = "rgba(255,255,255,0.16)";
          bctx.setLineDash([5, 5]);
          bctx.lineWidth = 2;
          bctx.beginPath(); bctx.arc(0, 0, 27 * 2, 0, Math.PI * 2); bctx.stroke();
          bctx.setLineDash([]);
          bctx.fillStyle = "rgba(255,255,255,0.35)";
          bctx.font = "600 13px system-ui, sans-serif";
          bctx.textAlign = "center";
          bctx.fillText("fighter (r27)", 0, 27 * 2 + 18);
          bctx.restore();

          // the bullet itself, pointing right, at 2× backing scale
          bctx.save();
          bctx.translate(W * 0.62, H / 2);
          bctx.scale(2, 2);
          CARD_SIM.drawBullet(bctx, spec, { scale, rotation, art: art.ok ? art.img : null });
          bctx.restore();
          // an arrow showing the direction of travel
          bctx.save();
          bctx.strokeStyle = "rgba(255,255,255,0.3)";
          bctx.lineWidth = 2;
          bctx.beginPath();
          bctx.moveTo(W * 0.62 + 70, H / 2); bctx.lineTo(W * 0.62 + 130, H / 2);
          bctx.moveTo(W * 0.62 + 118, H / 2 - 8); bctx.lineTo(W * 0.62 + 130, H / 2);
          bctx.lineTo(W * 0.62 + 118, H / 2 + 8);
          bctx.stroke();
          bctx.restore();

          bulletInfo.textContent =
            `r ${(spec.r * scale).toFixed(1)}px${spec.pellets > 1 ? ` · ${spec.pellets} pellets` : ""}` +
            `${art.ok ? " · art loaded" : " · procedural (no art yet)"}`;
          bScaleOut.textContent = `${scale.toFixed(2)}×`;
          bRotOut.textContent = `${Math.round(rotation)}°`;
          bScale.value = scale;
          bRot.value = rotation;
        }

        function setTweak(key, value) {
          const c = currentCard();
          if (!c) return;
          const t = tweaks[c.id] || {};
          t[key] = value;
          if ((t.scale ?? 1) === 1 && (t.rotation ?? 0) === 0) delete tweaks[c.id];
          else tweaks[c.id] = t;
          localStorage.setItem(TWEAK_KEY, JSON.stringify(tweaks));
          tweakCount();
          drawBulletPane();
        }

        bScale.addEventListener("input", () => setTweak("scale", Number(bScale.value)));
        bRot.addEventListener("input", () => setTweak("rotation", Number(bRot.value)));
        document.getElementById("resetBullet").addEventListener("click", () => {
          const c = currentCard();
          if (!c) return;
          delete tweaks[c.id];
          localStorage.setItem(TWEAK_KEY, JSON.stringify(tweaks));
          tweakCount();
          drawBulletPane();
        });

        document.getElementById("exportBtn").addEventListener("click", () => {
          const payload = {
            note: "Rounders card workbench — bullet tweaks. Hand this to Claude to apply.",
            generated: new Date().toISOString(),
            bullets: tweaks
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "card-workbench-changes.json";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        });
        tweakCount();

        function renderFeatured() {
          const list = visible();
          if (!list.length) { featured.innerHTML = ""; meta.textContent = "No rarities selected."; stopSim(); return; }
          index = ((index % list.length) + list.length) % list.length;
          const c = list[index];
          buildSim(c);
          if (previewOn) drawBulletPane();
          document.getElementById("previewBtn").textContent = previewOn ? "▣ Hide preview" : "▶ Preview this card";
          // the big face keeps the draft hand's "selected" pop, minus the tilt
          featured.innerHTML = cardHtml(c, true);
          featured.querySelector(".card").style.transform = "none";
          meta.innerHTML = `<b>${c.name}</b> — ${RARITIES[c.rarity].name} · ${index + 1} / ${list.length}` +
            ` · tags: ${(c.tags || []).join(", ") || "—"}`;
          for (const el of grid.querySelectorAll(".card")) {
            el.classList.toggle("current", el.dataset.id === c.id);
          }
          const url = new URL(location);
          url.searchParams.set("card", c.id);
          history.replaceState(null, "", url);
        }

        function renderGrid() {
          let html = "";
          for (const r of RARITY_ORDER) {
            const set = CARDS.filter(c => c.rarity === r);
            html += `<h2 class="cw-rarity-head" data-rarity="${r}" style="--c:${RARITIES[r].color}">` +
              `${RARITIES[r].name} — ${set.length}</h2>`;
            html += set.map(c => cardHtml(c, false)).join("");
          }
          grid.innerHTML = html;
          grid.addEventListener("click", e => {
            const el = e.target.closest(".card");
            if (!el) return;
            const list = visible();
            const i = list.findIndex(c => c.id === el.dataset.id);
            if (i >= 0) { index = i; renderFeatured(); scrollTo({ top: 0, behavior: "smooth" }); }
          });
        }

        function applyFilter() {
          for (const el of grid.querySelectorAll(".card")) {
            el.classList.toggle("hidden-rarity", !shown.has(el.className.match(/r-(\w+)/)[1]));
          }
          for (const el of grid.querySelectorAll(".cw-rarity-head")) {
            el.classList.toggle("hidden-rarity", !shown.has(el.dataset.rarity));
          }
          for (const el of filtersEl.querySelectorAll(".cw-chip")) {
            el.classList.toggle("off", !shown.has(el.dataset.rarity));
          }
          const total = visible().length;
          countEl.textContent = `${total} / ${CARDS.length} cards`;
          index = 0;
          renderFeatured();
        }

        filtersEl.innerHTML = RARITY_ORDER.map(r =>
          `<button class="cw-chip" data-rarity="${r}" style="--c:${RARITIES[r].color}">` +
          `${RARITIES[r].name} ${CARDS.filter(c => c.rarity === r).length}</button>`).join("");
        filtersEl.addEventListener("click", e => {
          const chip = e.target.closest(".cw-chip");
          if (!chip) return;
          const r = chip.dataset.rarity;
          if (shown.has(r) && shown.size === 1) RARITY_ORDER.forEach(x => shown.add(x)); // lone chip re-opens all
          else if (shown.has(r)) shown.delete(r);
          else shown.add(r);
          applyFilter();
        });

        document.getElementById("prev").addEventListener("click", () => { index -= 1; renderFeatured(); });
        document.getElementById("next").addEventListener("click", () => { index += 1; renderFeatured(); });
        addEventListener("keydown", e => {
          if (e.key === "ArrowLeft") { index -= 1; renderFeatured(); }
          else if (e.key === "ArrowRight") { index += 1; renderFeatured(); }
          else if (/^[1-6]$/.test(e.key)) {
            const r = RARITY_ORDER[Number(e.key) - 1];
            if (shown.has(r)) shown.delete(r); else shown.add(r);
            applyFilter();
          }
        });

        renderGrid();
        countEl.textContent = `${CARDS.length} / ${CARDS.length} cards`;
        renderFeatured();
      })();
    </script>
  </body>
</html>
