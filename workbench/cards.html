<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rounders — Card Workbench</title>
    <!-- The game's own stylesheet, so a card here IS the card in the game -->
    <link rel="stylesheet" href="../styles.css" />
    <style>
      /* Two panes: the whole set on the left to arrow through, the live
         preview on the right. Card faces themselves come from styles.css. */
      html, body { height: 100%; overflow: hidden; }
      body {
        margin: 0;
        background:
          radial-gradient(ellipse at 50% -10%, #2a2f42, transparent 60%),
          linear-gradient(180deg, #171a24, #0d0f16);
        color: #f5f2ff;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
      }
      .cw-bar {
        flex: none;
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        padding: 10px 16px;
        background: rgba(13, 15, 22, 0.92);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .cw-bar h1 { margin: 0 6px 0 0; font-size: 16px; letter-spacing: 0.04em; }
      .cw-count { opacity: 0.6; font-size: 12.5px; }
      .cw-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
      .cw-chip {
        border: 1px solid color-mix(in srgb, var(--c, #b8c4d0) 55%, transparent);
        color: var(--c, #b8c4d0);
        background: color-mix(in srgb, var(--c, #b8c4d0) 10%, transparent);
        border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 700;
        cursor: pointer;
      }
      .cw-chip.off { opacity: 0.32; filter: saturate(0.4); }
      .cw-back { color: #8fb8ff; font-size: 13px; text-decoration: none; }
      .cw-btn {
        border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.08);
        color: #f5f2ff; border-radius: 8px; padding: 5px 12px; font-size: 12px;
        font-weight: 700; cursor: pointer;
      }
      .cw-btn:hover { background: rgba(255, 255, 255, 0.16); }

      /* ---------------------------------------------------------- layout */
      .cw-main { flex: 1; display: flex; min-height: 0; }

      /* LEFT: the selector — full card faces, three to a row, own scrollbar */
      .cw-pick {
        flex: 0 0 50%;
        min-width: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 12px 16px 60px;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        scrollbar-gutter: stable;
      }
      .cw-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px 12px;
        --cardw: 100%;
      }
      .cw-grid .card {
        margin: 0; width: 100%; animation: none;
        transform: none;
        /* unpicked cards sit back, like the draft hand, so the current one pops */
        filter: saturate(0.45) brightness(0.62);
        opacity: 0.8;
      }
      .cw-grid .card:hover { transform: translateY(-4px); filter: saturate(0.8) brightness(0.85); opacity: 0.95; }
      .cw-grid .card.current {
        filter: none; opacity: 1;
        border-color: #fff;
        box-shadow: 0 0 0 2px #fff, 0 0 34px var(--rglow), 0 12px 26px rgba(0, 0, 0, 0.55);
        transform: translateY(-2px);
      }
      .cw-grid .card.hidden-rarity { display: none; }
      .cw-rarity-head {
        grid-column: 1 / -1;
        margin: 14px 0 0;
        font-size: 11.5px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--c); opacity: 0.9;
      }
      .cw-rarity-head.hidden-rarity { display: none; }

      /* RIGHT: the preview panes */
      .cw-view {
        flex: 1 1 50%;
        min-width: 0;
        overflow-y: auto;
        padding: 14px 18px 40px;
      }
      .cw-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
      .cw-head h2 { margin: 0; font-size: 20px; color: var(--rcol, #fff); }
      .cw-head .cw-rar {
        font-size: 10px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase;
        color: #0d0b14; background: var(--rcol, #fff); border-radius: 20px; padding: 3px 9px;
      }
      .cw-head em { font-size: 13px; opacity: 0.6; }
      .cw-desc { margin: 0 0 10px; font-size: 13.5px; line-height: 1.5; opacity: 0.92; max-width: 62ch; }
      .cw-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
      .cw-pills span {
        font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 8px;
        background: color-mix(in srgb, var(--rcol, #888) 16%, transparent);
        border: 1px solid color-mix(in srgb, var(--rcol, #888) 35%, transparent);
      }
      .cw-prev-head { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
      .cw-prev-head strong { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7; }
      #simCanvas {
        width: 100%; aspect-ratio: 720 / 320; display: block;
        border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.14); background: #12141c;
      }
      .cw-watch { margin: 8px 0 0; padding: 0 0 0 18px; font-size: 12.5px; line-height: 1.5; opacity: 0.8; }
      .cw-watch li { margin: 1px 0; }
      #bulletCanvas {
        width: 100%; aspect-ratio: 960 / 220; display: block;
        border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12); background: #0f111a;
      }
      .cw-sliders { display: grid; gap: 6px; margin-top: 8px; }
      .cw-sliders label { display: flex; align-items: center; gap: 10px; font-size: 12px; opacity: 0.85; }
      .cw-sliders input[type="range"] { flex: 1; }
      .cw-sliders output { width: 56px; text-align: right; font-variant-numeric: tabular-nums; opacity: 0.75; }
      .cw-hint { font-size: 11.5px; opacity: 0.45; margin: 14px 0 0; }

      @media (max-width: 1100px) {
        .cw-main { flex-direction: column; }
        .cw-pick { flex: none; height: 45%; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .cw-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <header class="cw-bar">
      <h1>Card Workbench</h1>
      <span class="cw-count" id="count"></span>
      <button class="cw-btn" id="exportBtn" title="Download the tweaks you've made as JSON">⬇ Export changes</button>
      <span class="cw-count" id="tweakCount"></span>
      <span class="cw-filters" id="filters"></span>
      <a class="cw-back" href="index.html">Sprite workbench →</a>
    </header>

    <main class="cw-main">
      <aside class="cw-pick" id="pick" tabindex="0">
        <div class="cw-grid" id="grid"></div>
      </aside>

      <section class="cw-view">
        <div class="cw-head" id="head"></div>
        <p class="cw-desc" id="desc"></p>
        <div class="cw-pills" id="pills"></div>

        <div class="cw-prev-head">
          <strong>Preview</strong>
          <button class="cw-btn" id="replayBtn">↻ Replay</button>
          <span class="cw-count" id="simState"></span>
        </div>
        <canvas id="simCanvas" width="1440" height="640"></canvas>
        <ul class="cw-watch" id="watch"></ul>

        <div class="cw-prev-head" style="margin-top:16px">
          <strong>Bullet — game size</strong>
          <span class="cw-count" id="bulletInfo"></span>
          <button class="cw-btn" id="resetBullet">Reset</button>
        </div>
        <canvas id="bulletCanvas" width="960" height="220"></canvas>
        <div class="cw-sliders">
          <label>Size <input id="bScale" type="range" min="0.2" max="4" step="0.05" value="1" /><output id="bScaleOut">1.00×</output></label>
          <label>Rotation <input id="bRot" type="range" min="-180" max="180" step="1" value="0" /><output id="bRotOut">0°</output></label>
        </div>

        <p class="cw-hint">
          ← → step a card · ↑ ↓ jump a row · Home / End · number keys 1–6 toggle rarities.
          The preview starts once you settle on a card, so arrowing stays snappy.
        </p>
      </section>
    </main>

    <script>window.ROUNDERS_ASSET_BASE = "../";</script>
    <script src="../js/chroma.js"></script>
    <script src="../js/characters.js"></script>
    <script src="../js/cards.js"></script>
    <script src="../js/gameplay.js"></script>
    <script src="../js/cardsim.js"></script>
    <script>
      (() => {
        "use strict";
        const { CARDS, RARITIES, RARITY_ORDER, CARD_SIM, cardArtUrl, cardSceneUrl } = window.ROUNDERS;
        const COLS = 3;
        const DWELL_MS = 220;           // how long you must rest on a card before it animates

        const grid = document.getElementById("grid");
        const pick = document.getElementById("pick");
        const countEl = document.getElementById("count");
        const filtersEl = document.getElementById("filters");
        const headEl = document.getElementById("head");
        const descEl = document.getElementById("desc");
        const pillsEl = document.getElementById("pills");
        const watchEl = document.getElementById("watch");
        const simState = document.getElementById("simState");
        const simCanvas = document.getElementById("simCanvas");
        const sctx = simCanvas.getContext("2d");

        const ordered = RARITY_ORDER.flatMap(r => CARDS.filter(c => c.rarity === r));
        const shown = new Set(RARITY_ORDER);
        const startId = new URLSearchParams(location.search).get("card");
        let index = Math.max(0, ordered.findIndex(c => c.id === startId));
        let sim = null;
        let dwellTimer = 0;

        const visible = () => ordered.filter(c => shown.has(c.rarity));
        const currentCard = () => {
          const l = visible();
          if (!l.length) return null;
          index = ((index % l.length) + l.length) % l.length;
          return l[index];
        };

        // exactly the markup the draft hand builds in game.js
        function cardHtml(c) {
          const rar = RARITIES[c.rarity];
          return `
            <article class="card r-${c.rarity}" data-id="${c.id}"
                     style="--rcol:${rar.color};--rglow:${rar.glow};--tilt:0deg">
              <span class="card-pip">${rar.name[0]}</span>
              <span class="rarity">${rar.name}</span>
              <span class="card-art" style="--scene:url('${cardSceneUrl(c.id)}');--emblem:url('${cardArtUrl(c.id)}')"></span>
              <strong class="card-name">${c.name}</strong>
              <em class="card-tagline">${c.tagline}</em>
              <p class="card-desc">${c.description}</p>
              <div class="stat-list">${c.effects.map(s => `<span>${s}</span>`).join("")}</div>
              <span class="card-pip flip">${rar.name[0]}</span>
            </article>`;
        }

        function renderGrid() {
          let html = "";
          for (const r of RARITY_ORDER) {
            const set = CARDS.filter(c => c.rarity === r);
            html += `<h2 class="cw-rarity-head" data-rarity="${r}" style="--c:${RARITIES[r].color}">${RARITIES[r].name} — ${set.length}</h2>`;
            html += set.map(cardHtml).join("");
          }
          grid.innerHTML = html;
          grid.addEventListener("click", e => {
            const el = e.target.closest(".card");
            if (!el) return;
            const i = visible().findIndex(c => c.id === el.dataset.id);
            if (i >= 0) select(i, true);
          });
        }

        // ------------------------------------------------------- selection
        // Cheap parts (highlight, card text, bullet pane) update instantly so
        // arrowing feels immediate; the animated sim waits for you to settle.
        function select(i, immediate = false) {
          index = i;
          const c = currentCard();
          if (!c) return;

          for (const el of grid.querySelectorAll(".card")) {
            const on = el.dataset.id === c.id;
            el.classList.toggle("current", on);
            if (on) el.scrollIntoView({ block: "nearest" });
          }

          const rar = RARITIES[c.rarity];
          headEl.style.setProperty("--rcol", rar.color);
          pillsEl.style.setProperty("--rcol", rar.color);
          headEl.innerHTML =
            `<h2>${c.name}</h2><span class="cw-rar">${rar.name}</span>` +
            `<em>${c.tagline}</em>` +
            `<span class="cw-count">${index + 1} / ${visible().length}${c.tags && c.tags.length ? " · " + c.tags.join(", ") : ""}</span>`;
          descEl.textContent = c.description;
          pillsEl.innerHTML = c.effects.map(s => `<span>${s}</span>`).join("");

          drawBulletPane();

          const url = new URL(location);
          url.searchParams.set("card", c.id);
          history.replaceState(null, "", url);

          // stop whatever was running and wait out the dwell
          stopSim();
          watchEl.innerHTML = CARD_SIM.planFor(c).watch.map(w => `<li>${w}</li>`).join("");
          placeholder(c);
          clearTimeout(dwellTimer);
          simState.textContent = "…";
          dwellTimer = setTimeout(startSim, immediate ? 0 : DWELL_MS);
        }

        function stopSim() { if (sim) { sim.stop(); sim = null; } }

        function placeholder(c) {
          const w = simCanvas.width, h = simCanvas.height;
          sctx.clearRect(0, 0, w, h);
          const g = sctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, "#232838"); g.addColorStop(1, "#12141c");
          sctx.fillStyle = g; sctx.fillRect(0, 0, w, h);
          sctx.fillStyle = "rgba(255,255,255,0.35)";
          sctx.font = "600 34px system-ui, sans-serif";
          sctx.textAlign = "center";
          sctx.fillText(c.name, w / 2, h / 2);
        }

        function startSim() {
          const c = currentCard();
          if (!c) return;
          stopSim();
          sim = CARD_SIM.createSim(simCanvas, c);
          sim.start();
          simState.textContent = "running";
        }

        document.getElementById("replayBtn").addEventListener("click", () => {
          if (sim) sim.replay(); else startSim();
        });

        // ---------------------------------------------------- bullet viewer
        const TWEAK_KEY = "rounders.bulletTweaks";
        let tweaks = {};
        try { tweaks = JSON.parse(localStorage.getItem(TWEAK_KEY) || "{}"); } catch { tweaks = {}; }

        const bulletCanvas = document.getElementById("bulletCanvas");
        const bctx = bulletCanvas.getContext("2d");
        const bScale = document.getElementById("bScale");
        const bRot = document.getElementById("bRot");
        const bScaleOut = document.getElementById("bScaleOut");
        const bRotOut = document.getElementById("bRotOut");
        const bulletInfo = document.getElementById("bulletInfo");
        const bulletArt = new Map();

        function tweakCount() {
          const n = Object.keys(tweaks).length;
          document.getElementById("tweakCount").textContent = n ? `${n} tweaked` : "";
        }

        function loadBulletArt(id) {
          if (bulletArt.has(id)) return bulletArt.get(id);
          const entry = { img: new Image(), ok: false };
          entry.img.onload = () => { entry.ok = true; drawBulletPane(); };
          entry.img.onerror = () => { entry.ok = false; };
          entry.img.src = `../assets/images/bullets/${id}.png`;
          bulletArt.set(id, entry);
          return entry;
        }

        function drawBulletPane() {
          const c = currentCard();
          if (!c) return;
          const spec = CARD_SIM.bulletSpec(c);
          const tw = tweaks[c.id] || {};
          const scale = tw.scale ?? 1;
          const rotation = tw.rotation ?? 0;
          const art = loadBulletArt(c.id);

          const W = bulletCanvas.width, H = bulletCanvas.height;
          bctx.clearRect(0, 0, W, H);
          bctx.fillStyle = "#0f111a";
          bctx.fillRect(0, 0, W, H);
          // fighter-radius circle for scale
          bctx.save();
          bctx.translate(W * 0.22, H / 2);
          bctx.strokeStyle = "rgba(255,255,255,0.16)";
          bctx.setLineDash([5, 5]);
          bctx.lineWidth = 2;
          bctx.beginPath(); bctx.arc(0, 0, 27 * 2, 0, Math.PI * 2); bctx.stroke();
          bctx.setLineDash([]);
          bctx.fillStyle = "rgba(255,255,255,0.35)";
          bctx.font = "600 13px system-ui, sans-serif";
          bctx.textAlign = "center";
          bctx.fillText("fighter (r27)", 0, 27 * 2 + 18);
          bctx.restore();
          // the round itself, pointing right, at 2× backing scale
          bctx.save();
          bctx.translate(W * 0.62, H / 2);
          bctx.scale(2, 2);
          CARD_SIM.drawBullet(bctx, spec, { scale, rotation, art: art.ok ? art.img : null });
          bctx.restore();
          bctx.save();
          bctx.strokeStyle = "rgba(255,255,255,0.3)";
          bctx.lineWidth = 2;
          bctx.beginPath();
          bctx.moveTo(W * 0.62 + 70, H / 2); bctx.lineTo(W * 0.62 + 130, H / 2);
          bctx.moveTo(W * 0.62 + 118, H / 2 - 8); bctx.lineTo(W * 0.62 + 130, H / 2);
          bctx.lineTo(W * 0.62 + 118, H / 2 + 8);
          bctx.stroke();
          bctx.restore();

          bulletInfo.textContent =
            `r ${(spec.r * scale).toFixed(1)}px${spec.pellets > 1 ? ` · ${spec.pellets} pellets` : ""}` +
            `${art.ok ? " · art loaded" : " · procedural (no art yet)"}`;
          bScaleOut.textContent = `${scale.toFixed(2)}×`;
          bRotOut.textContent = `${Math.round(rotation)}°`;
          bScale.value = scale;
          bRot.value = rotation;
        }

        function setTweak(key, value) {
          const c = currentCard();
          if (!c) return;
          const t = tweaks[c.id] || {};
          t[key] = value;
          if ((t.scale ?? 1) === 1 && (t.rotation ?? 0) === 0) delete tweaks[c.id];
          else tweaks[c.id] = t;
          localStorage.setItem(TWEAK_KEY, JSON.stringify(tweaks));
          tweakCount();
          drawBulletPane();
        }

        bScale.addEventListener("input", () => setTweak("scale", Number(bScale.value)));
        bRot.addEventListener("input", () => setTweak("rotation", Number(bRot.value)));
        document.getElementById("resetBullet").addEventListener("click", () => {
          const c = currentCard();
          if (!c) return;
          delete tweaks[c.id];
          localStorage.setItem(TWEAK_KEY, JSON.stringify(tweaks));
          tweakCount();
          drawBulletPane();
        });

        document.getElementById("exportBtn").addEventListener("click", () => {
          const payload = {
            note: "Rounders card workbench — bullet tweaks. Hand this to Claude to apply.",
            generated: new Date().toISOString(),
            bullets: tweaks
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "card-workbench-changes.json";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        });

        // --------------------------------------------------------- filters
        function applyFilter() {
          const keep = currentCard();
          for (const el of grid.querySelectorAll(".card")) {
            el.classList.toggle("hidden-rarity", !shown.has(el.className.match(/r-(\w+)/)[1]));
          }
          for (const el of grid.querySelectorAll(".cw-rarity-head")) {
            el.classList.toggle("hidden-rarity", !shown.has(el.dataset.rarity));
          }
          for (const el of filtersEl.querySelectorAll(".cw-chip")) {
            el.classList.toggle("off", !shown.has(el.dataset.rarity));
          }
          const list = visible();
          countEl.textContent = `${list.length} / ${CARDS.length} cards`;
          // stay on the same card if it survived the filter
          const at = keep ? list.findIndex(c => c.id === keep.id) : -1;
          select(at >= 0 ? at : 0, true);
        }

        filtersEl.innerHTML = RARITY_ORDER.map(r =>
          `<button class="cw-chip" data-rarity="${r}" style="--c:${RARITIES[r].color}">` +
          `${RARITIES[r].name} ${CARDS.filter(c => c.rarity === r).length}</button>`).join("");
        filtersEl.addEventListener("click", e => {
          const chip = e.target.closest(".cw-chip");
          if (!chip) return;
          const r = chip.dataset.rarity;
          if (shown.has(r) && shown.size === 1) RARITY_ORDER.forEach(x => shown.add(x));
          else if (shown.has(r)) shown.delete(r); else shown.add(r);
          applyFilter();
        });

        // -------------------------------------------------------- keyboard
        addEventListener("keydown", e => {
          if (e.target.tagName === "INPUT") return;      // sliders keep their arrows
          const n = visible().length;
          if (!n) return;
          let next = null;
          if (e.key === "ArrowRight") next = index + 1;
          else if (e.key === "ArrowLeft") next = index - 1;
          else if (e.key === "ArrowDown") next = Math.min(index + COLS, n - 1);
          else if (e.key === "ArrowUp") next = Math.max(index - COLS, 0);
          else if (e.key === "Home") next = 0;
          else if (e.key === "End") next = n - 1;
          else if (/^[1-6]$/.test(e.key)) {
            const r = RARITY_ORDER[Number(e.key) - 1];
            if (shown.has(r)) shown.delete(r); else shown.add(r);
            applyFilter();
            e.preventDefault();
            return;
          }
          if (next === null) return;
          e.preventDefault();                            // don't scroll the pane too
          select(((next % n) + n) % n);
        });

        renderGrid();
        countEl.textContent = `${CARDS.length} / ${CARDS.length} cards`;
        tweakCount();
        select(index, true);
        pick.focus({ preventScroll: true });
      })();
    </script>
  </body>
</html>
